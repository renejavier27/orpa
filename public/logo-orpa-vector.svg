<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ORPA - Orozco Pérez y Asociados</title>
  <desc id="desc">Logo vectorial aproximado inspirado en la marca ORPA, usando azul navy y gris plata.</desc>

  <defs>
    <linearGradient id="orpaNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24366F"/>
      <stop offset="100%" stop-color="#101C47"/>
    </linearGradient>

    <linearGradient id="orpaSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9DDE7"/>
      <stop offset="100%" stop-color="#7E8799"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101C47" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(52 34)" filter="url(#softShadow)">
    <circle cx="96" cy="96" r="86" fill="white" stroke="#E6E9F0" stroke-width="6"/>
    <circle cx="76" cy="76" r="42" fill="url(#orpaNavy)"/>
    <circle cx="116" cy="76" r="42" fill="#2C3E79" opacity="0.96"/>
    <circle cx="76" cy="116" r="42" fill="#7E8799" opacity="0.92"/>
    <circle cx="116" cy="116" r="42" fill="url(#orpaSilver)" opacity="0.96"/>
    <path d="M96 36 V156" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 96 H156" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <circle cx="96" cy="96" r="16" fill="white"/>
    <circle cx="96" cy="96" r="9" fill="#101C47"/>
  </g>

  <g transform="translate(250 54)">
    <text x="0" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="8" fill="#101C47">ORPA</text>
    <rect x="4" y="110" width="430" height="2.5" rx="1.25" fill="#8A94A6"/>
    <text x="2" y="152" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4.5" fill="#6F7787">OROZCO PÉREZ &amp; ASOCIADOS</text>
    <text x="4" y="186" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" letter-spacing="2.5" fill="#8A94A6">FIRMA LEGAL · PANAMÁ</text>
  </g>
</svg>
